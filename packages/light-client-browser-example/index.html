<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Light Client Browser Example</title>
	</head>
	<body>
		<main>
			<p>Enter the deployed application contract that inherits CIDAccumulator.</p>
			<label for="contract-input">Consumer contract:</label>
			<input id="contract-input" type="text" placeholder="NOT_YET_DEPLOYED" style="width: 400px;" />
			<label for="rpc-input">Ethereum RPC:</label>
			<input id="rpc-input" type="url" value="http://127.0.0.1:8545" style="width: 400px;" />
			<button id="start-button">Start</button>
			<button id="stop-button">Stop</button>
		</main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
